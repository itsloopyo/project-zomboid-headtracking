[workspace]
name = "project-zomboid-headtracking"
version = "0.0.0"
description = "Head tracking mod for Project Zomboid"
license = "MIT"
channels = ["conda-forge"]
platforms = ["win-64"]

[dependencies]
# CMake and Visual Studio, which build CameraUnlockCore.dll from the submodule, come from the system.
# The game runs on a bundled Java 25 runtime, and the agent uses the
# java.lang.classfile API that became final in Java 24, so the build needs the
# same major version and no bytecode library.
openjdk = ">=25,<26"
# glslangValidator, the Khronos reference compiler the tests put every shader through. Only a
# graphics driver compiles them otherwise, and a lenient one lets by what another refuses.
glslang = "16.6.*"

[tasks]
update-submodule = "git submodule update --remote cameraunlock-core && powershell -NoProfile -ExecutionPolicy Bypass -File cameraunlock-core/scripts/update-submodule.ps1"
sync = "git submodule update --remote cameraunlock-core"
update-deps = "powershell -NoProfile -Command \"Write-Host 'No vendored dependencies to update: the mod uses no mod loader.'\""

# Nothing to prepare: javac compiles against the signature stubs in stubs/, so
# the build needs no file from a game install and no downloaded reference.
setup = "powershell -NoProfile -Command \"Write-Host 'Nothing to set up: the build compiles against the stubs in stubs/.'\""

build = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build.ps1"
test = { cmd = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/test.ps1", depends-on = ["build"] }
# No PowerShell variable in the command: pixi's task shell expands $name itself, before
# PowerShell reads the line.
clean = "powershell -NoProfile -Command \"Get-Item build, build-core, build-native, release -ErrorAction Ignore | Remove-Item -Recurse -Force\""

# Rewrites config/CameraUnlock.ini, the committed copy of the CameraUnlock.ini the mod creates at
# first launch, from the rows Config.java describes to cameraunlock-core, after a change to a row,
# a comment or a default, then rewrites the per_game of a launcher-manifest.json config descriptor
# where there is one.
render-config = { cmd = "java --enable-native-access=ALL-UNNAMED -cp \"build/classes;build/test-classes\" com.cameraunlock.zomboid.RenderConfig config/CameraUnlock.ini && node cameraunlock-core/scripts/encode-seed.mjs", depends-on = ["build"] }

# The installer ZIP and a development ZIP (the same, with the development jar
# in it) in release/. package-release.ps1 says why there is no Nexus ZIP.
package = { cmd = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/package-release.ps1", depends-on = ["build", "test"] }

# Both read what is already there, so neither depends on package.
validate-manifest = "node cameraunlock-core/scripts/validate-manifest.mjs"
validate-notices = "node cameraunlock-core/scripts/validate-notices.mjs"

# Deploys the development jar (the development keys in), cameraunlock-core's DLL and the site JVM config to every installed copy
# of the game. A path after the task name deploys to that one folder instead.
install = { cmd = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/deploy.ps1", depends-on = ["build"] }
# Runs uninstall.cmd /y against every copy install deploys to. /y keeps it prompt-free: pixi gives a
# task no console to read from.
uninstall = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/undeploy.ps1"

release = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/release.ps1"
release-nightly = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/release-nightly.ps1"
