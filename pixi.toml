[workspace]
name = "project-zomboid-headtracking"
version = "0.0.0"
description = "Head tracking mod for Project Zomboid"
license = "MIT"
channels = ["conda-forge"]
platforms = ["win-64"]

[dependencies]
# The game runs on a bundled Java 25 runtime, and the agent uses the
# java.lang.classfile API that became final in Java 24, so the build needs the
# same major version and no bytecode library.
openjdk = ">=25,<26"

[tasks]
update-submodule = "git submodule update --remote cameraunlock-core && powershell -NoProfile -ExecutionPolicy Bypass -File cameraunlock-core/scripts/update-submodule.ps1"
sync = "git submodule update --remote cameraunlock-core"
update-deps = "powershell -NoProfile -Command \"Write-Host 'No vendored dependencies to update (shim-only mod).'\""

# Nothing to prepare: javac compiles against the signature stubs in stubs/, so
# the build needs no file from a game install and no downloaded reference.
setup = "powershell -NoProfile -Command \"Write-Host 'Nothing to set up: the build compiles against the stubs in stubs/.'\""

build = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build.ps1"
test = { cmd = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/test.ps1", depends-on = ["build"] }
clean = "powershell -NoProfile -Command \"if (Test-Path build) { Remove-Item -Recurse -Force build }; if (Test-Path release) { Remove-Item -Recurse -Force release }\""

# The installer ZIP and a development ZIP (the same, with the development keys
# on) in release/. package-release.ps1 says why there is no Nexus ZIP.
package = { cmd = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/package-release.ps1", depends-on = ["build", "test"] }

# Both read what is already there, so neither depends on package.
validate-manifest = "node cameraunlock-core/scripts/validate-manifest.mjs"
validate-notices = "node cameraunlock-core/scripts/validate-notices.mjs"

# Deploys the built jar and the site JVM config to every installed copy of the
# game. A path after the task name deploys to that one folder instead.
install = { cmd = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/deploy.ps1", depends-on = ["build"] }
# /y keeps it prompt-free: pixi gives a task no console to read from.
uninstall = "cmd /c scripts\\uninstall.cmd /y"

release = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/release.ps1"
release-nightly = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/release-nightly.ps1"

# Launches every installed copy's game with the built agent loaded, for
# development. Arguments after the task name are passed to the script.
run-game = { cmd = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/run-game.ps1", depends-on = ["build"] }
