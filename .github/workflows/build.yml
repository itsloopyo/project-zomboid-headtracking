name: Build

on:
  push:
    branches: ['**']
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - 'LICENSE'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Validate
    runs-on: windows-latest
    # release.ps1's version commit is built by the tag's release workflow.
    if: ${{ !startsWith(github.event.head_commit.message, 'Release v') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          submodules: recursive

      # cameraunlock-core's WebAssembly toolchain (its scripts/wasm-toolchain.mjs): about 620 MB to
      # fetch and 1.5 GB unpacked. Keyed on the file that pins it, and the archive is left out.
      - name: Cache the WebAssembly toolchain
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/AppData/Local/cameraunlock-core/toolchain
            !~/AppData/Local/cameraunlock-core/toolchain/*.tar.gz
          key: wasm-toolchain-${{ runner.os }}-${{ hashFiles('cameraunlock-core/scripts/wasm-toolchain.mjs') }}

      # The JDK comes from the pixi environment, so there is no setup-java step.
      - name: Setup pixi
        uses: prefix-dev/setup-pixi@5185adfbffb4bd703da3010310260805d89ebb11 # v0.9.6
        with:
          # Without pixi-version, setup-pixi installs the newest pixi release.
          pixi-version: v0.81.0

      - name: Build, test and package
        shell: pwsh
        run: |
          pixi run package
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::pixi run package failed"
            exit 1
          }

      - name: Verify the ZIPs were produced
        shell: pwsh
        run: |
          foreach ($kind in 'installer', 'launcher', 'workshop') {
            $zip = Get-ChildItem "release/*-$kind.zip" -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $zip) {
              Write-Host "::error::No $kind ZIP was produced by 'pixi run package'"
              exit 1
            }
          }
