name: Release
run-name: "Release ${{ github.ref_name }}"

# Everything this release does lives in cameraunlock-core's release-mod.yml.
# Only the values below are this mod's. Pinned to a commit SHA, never a branch:
# that workflow runs with contents:write, the Discord webhook and the Lopari PAT.

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    uses: itsloopyo/cameraunlock-core/.github/workflows/release-mod.yml@07e264e3fb0bb78e1c77515034aeaaa983c81492
    with:
      project-name: 'Head Tracking for Project Zomboid'
      # pixi.toml's [workspace] version is the one scripts/build.ps1 stamps into
      # the jar's manifest.
      version-source: pixi
      version-path: 'pixi.toml'
      artifact-paths: 'src/ scripts/ workshop/ pixi.toml launcher-manifest.json cameraunlock-core'
      # The package builds cameraunlock-core's jar, whose WebAssembly toolchain is cached.
      wasm-toolchain: true
      # No .NET or MSBuild: the JDK comes from the pixi environment.
    permissions:
      contents: write
    secrets: inherit
